# ============================================================
# 能源可信数据空间平台 · 前端 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#   /          → SPA 静态资源（vite 构建产物）
#   /api/      → http://backend:8000（保留 /api/v1 前缀，透传 Authorization / X-Trace-Id）
#   /ws        → http://backend:8000/ws（WebSocket，带 Upgrade/Connection 头）
# 说明：upstream 用变量 + 内置 DNS（127.0.0.11）做"惰性解析"，
#       这样在 backend 尚未启动 / 不存在（MSW 模式）时 nginx 也能正常起来。
# ============================================================

# 把 Connection 头映射为 upgrade / close，用于 WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 上传 / 大请求体上限
    client_max_body_size 20m;

    # gzip 压缩
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript application/json
                      application/xml image/svg+xml font/woff2 application/wasm;

    # docker 内置 DNS，惰性解析 backend 主机名
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 安全头（演示环境够用）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # --- 后端 REST API：/api/v1/... 原样转发 ---
    location /api/ {
        proxy_pass              $backend_upstream;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Authorization     $http_authorization;
        proxy_set_header        X-Trace-Id        $http_x_trace_id;
        proxy_pass_header       X-Trace-Id;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      120s;     # FL / 调度同步接口可能较慢
        proxy_buffering         off;      # CSV 导出流式返回
    }

    # --- WebSocket：/ws?token=... ---
    location /ws {
        proxy_pass              $backend_upstream;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $connection_upgrade;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        Authorization     $http_authorization;
        proxy_connect_timeout   10s;
        proxy_send_timeout      3600s;
        proxy_read_timeout      3600s;    # 长连接，避免 60s 被断开
        proxy_buffering         off;
    }

    # --- MSW service worker 不能被缓存，否则兜底模式切换不生效 ---
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # --- 带 hash 的静态资源长缓存 ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- SPA 路由回退 ---
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # 容器健康检查
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
