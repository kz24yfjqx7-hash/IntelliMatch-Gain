# ============================================================
# 能源可信数据空间平台 · 前端 nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
#   /          → SPA 静态资源（vite 构建产物）
#   /api/      → http://backend:8000（保留 /api/v1 前缀，透传 Authorization / X-Trace-Id）
#   /ws        → http://backend:8000/ws（WebSocket，带 Upgrade/Connection 头）
#   /health    → http://backend:8000/health（后端探活，供 install.sh / kiosk.sh 轮询；/healthz 仍是 nginx 自身）
# 说明：upstream 用变量 + 内置 DNS（127.0.0.11）做"惰性解析"，
#       这样在 backend 尚未启动 / 不存在（MSW 模式）时 nginx 也能正常起来。
# ============================================================

# 把 Connection 头映射为 upgrade / close，用于 WebSocket
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HSTS 只有在 TLS 生效时才有意义：http 上发这个头，浏览器直接忽略，
# 反而会在同域将来上 https 时留下踩坑余地。用 $scheme 做条件——
# nginx 的 add_header 遇到空字符串值会跳过，所以 http 访问时这个头根本不出现。
# 现网接了 TLS（或前面有 TLS 终结的网关并透传 X-Forwarded-Proto）时自动生效。
map $scheme $hsts_header {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen       80;
    server_name  _;

    # 不回显 nginx 版本号（响应头 Server 与错误页）
    server_tokens off;

    root   /usr/share/nginx/html;
    index  index.html;

    # 上传 / 大请求体上限
    client_max_body_size 20m;

    # gzip 压缩
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript application/json
                      application/xml image/svg+xml font/woff2 application/wasm;

    # docker 内置 DNS，惰性解析 backend 主机名
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 安全头。注意：nginx 的 add_header 不跨层级叠加——
    # 任何自己写了 add_header 的 location 都会丢掉这里的头，所以下面带 Cache-Control 的 location 里要重复一遍。
    #
    # CSP 说明（测试文档-接口与安全 §6）：
    #   script-src 'self'    构建产物是 ES module 外链，index.html 里没有内联 <script>，不需要 unsafe-inline/eval
    #   style-src  加 'unsafe-inline'  index.html 有一段内联 <style>，且 Element Plus / ECharts 运行时会写行内样式，去掉会白屏
    #   img-src    加 data: blob:      ECharts 导出图片、二维码、头像占位都走 data:/blob:
    #   connect-src 'self'   同源的 http(s) 与 ws(s) 都在 'self' 内（CSP3：'self' 匹配同源的 ws/wss），
    #                        因此 /api/v1 与 /ws 都放行，而任何外站上报/外链 CDN 一律被拦
    #   worker-src 加 blob:  MSW 兜底模式的 service worker
    #   frame-ancestors 'self' 与上面的 X-Frame-Options SAMEORIGIN 同义，给支持 CSP 的新浏览器用
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
    add_header Strict-Transport-Security $hsts_header always;

    # --- 后端 REST API：/api/v1/... 原样转发 ---
    location /api/ {
        proxy_pass              $backend_upstream;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Authorization     $http_authorization;
        proxy_set_header        X-Trace-Id        $http_x_trace_id;
        proxy_pass_header       X-Trace-Id;
        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      120s;     # FL / 调度同步接口可能较慢
        proxy_buffering         off;      # CSV 导出流式返回
    }

    # --- WebSocket：/ws?token=... ---
    location /ws {
        proxy_pass              $backend_upstream;
        proxy_http_version      1.1;
        proxy_set_header        Upgrade           $http_upgrade;
        proxy_set_header        Connection        $connection_upgrade;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        Authorization     $http_authorization;
        proxy_connect_timeout   10s;
        proxy_send_timeout      3600s;
        proxy_read_timeout      3600s;    # 长连接，避免 60s 被断开
        proxy_buffering         off;
    }

    # --- MSW service worker 不能被缓存，否则兜底模式切换不生效 ---
    location = /mockServiceWorker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Strict-Transport-Security $hsts_header always;
        try_files $uri =404;
    }

    # --- 带 hash 的静态资源长缓存 ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Strict-Transport-Security $hsts_header always;
        try_files $uri =404;
    }

    # --- SPA 路由回退 ---
    # try_files 里**不能**带 $uri/：前端有一个 /assets 路由（资产中心），而构建产物里
    # 恰好也有一个 assets/ 目录，$uri/ 会让 nginx 对 /assets 发 301 到 /assets/，
    # 落进下面的 location /assets/ 后 try_files $uri =404 → 资产中心页面 404。
    # SPA 不需要目录索引，静态目录各自有 location 兜着，直接回退 index.html 即可。
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;
        add_header Strict-Transport-Security $hsts_header always;
        try_files $uri /index.html;
    }

    # --- 后端探活：backend 根路径 GET /health（不包装、不需登录），install.sh / kiosk.sh 轮询用 ---
    # 注意 /api/v1/health 不存在（后端返回 404 的 1005 包裹），必须走根路径
    location = /health {
        access_log              off;
        proxy_pass              $backend_upstream/health;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_connect_timeout   3s;
        proxy_read_timeout      5s;
    }

    # 容器健康检查（nginx 自身，不依赖 backend）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
